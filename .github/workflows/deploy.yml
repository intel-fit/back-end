name: CI/CD Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  DOCKER_IMAGE: intelfit-backend
  EC2_HOST: 43.200.40.140
  EC2_USER: ubuntu

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Admin123!
          MYSQL_DATABASE: intelfit
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Refresh dependencies and verify Gradle version
        run: |
          ./gradlew --version
          ./gradlew clean --refresh-dependencies --no-daemon

      - name: Wait for MySQL to be ready
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root -pAdmin123! --silent; do
            echo 'Waiting for MySQL...'
            sleep 2
          done

      - name: Run tests
        run: ./gradlew test --no-daemon --refresh-dependencies
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/intelfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: Admin123!
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: intelfit-jwt-secret-key-for-production-use-minimum-32-characters-long-2024
          SPRING_MAIL_HOST: smtp.naver.com
          SPRING_MAIL_PORT: 587
          SPRING_MAIL_USERNAME: lkmm1108@naver.com
          SPRING_MAIL_PASSWORD: 7BJRP2P6F2LF

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "🔧 Building Docker image with no cache to ensure latest dependencies..."
          docker build --no-cache --pull -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
          echo "✅ Docker image built successfully"

      - name: Save Docker image
        run: |
          echo "📦 Saving Docker image..."
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > image.tar.gz
          ls -lh image.tar.gz

      - name: Create Caddyfile if not exists
        run: |
          if [ ! -f Caddyfile ]; then
            echo "📝 Creating Caddyfile..."
            cat > Caddyfile << 'EOF'
          # Caddyfile for IntelFit Backend
          {
              admin off
              auto_https off
          }

          :80 {
              # 로깅 활성화
              log {
                  output stdout
                  format console
                  level INFO
              }

              # Caddy 자체 헬스체크 (최우선) - Docker healthcheck용
              handle /health {
                  respond "OK" 200
              }

              # 기본 리버스 프록시
              reverse_proxy spring-app:8080 {
                  header_up Host {host}
                  header_up X-Real-IP {remote}
                  header_up X-Forwarded-For {remote}
                  header_up X-Forwarded-Proto {scheme}
          
                  transport http {
                      dial_timeout 10s
                      response_header_timeout 30s
                  }
              }
          }
          EOF
            echo "✅ Caddyfile created"
          else
            echo "✅ Caddyfile already exists"
          fi

      - name: Create deploy.sh
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash

          # 색상 코드
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m'

          # 로그 함수
          log() {
              echo -e "${GREEN}[$(date '+%Y-%m-%d %H:%M:%S')]${NC} $1"
          }

          error() {
              echo -e "${RED}[$(date '+%Y-%m-%d %H:%M:%S')]${NC} ❌ $1"
          }

          warn() {
              echo -e "${YELLOW}[$(date '+%Y-%m-%d %H:%M:%S')]${NC} ⚠️ $1"
          }

          info() {
              echo -e "${BLUE}[$(date '+%Y-%m-%d %H:%M:%S')]${NC} ℹ️ $1"
          }

          # 배포 설정
          DOCKER_IMAGE="intelfit-backend:latest"
          CONTAINER_NAME="spring-app"
          MAX_ATTEMPTS=40
          HEALTH_CHECK_INTERVAL=5

          set -e

          log "🚀 IntelFit 백엔드 배포를 시작합니다..."

          # 기존 서비스 정리
          log "🔄 기존 서비스를 정리합니다..."
          docker compose down --remove-orphans || warn "서비스 정리 중 일부 문제 발생 (계속 진행)"

          # 미사용 리소스 정리
          log "🧹 미사용 Docker 리소스를 정리합니다..."
          docker image prune -f || true

          # 서비스 시작
          log "🌟 서비스를 시작합니다..."
          docker compose up -d

          # 초기 대기
          log "⏳ 서비스 초기화를 위해 대기합니다..."
          sleep 25

          # MySQL 상태 확인
          log "🔍 MySQL 상태를 확인합니다..."
          MYSQL_READY=false
          for i in {1..30}; do
              if docker exec mysql mysqladmin ping -h localhost -u root -pAdmin123! --silent 2>/dev/null; then
                  log "✅ MySQL이 준비되었습니다."
                  MYSQL_READY=true
                  break
              fi
              sleep 2
          done

          if [ "$MYSQL_READY" = false ]; then
              error "MySQL 시작 실패"
              exit 1
          fi

          # Redis 상태 확인
          log "🔍 Redis 상태를 확인합니다..."
          REDIS_READY=false
          for i in {1..20}; do
              if docker exec redis redis-cli ping > /dev/null 2>&1; then
                  log "✅ Redis가 준비되었습니다."
                  REDIS_READY=true
                  break
              fi
              sleep 1
          done

          if [ "$REDIS_READY" = false ]; then
              error "Redis 시작 실패"
              exit 1
          fi

          # Spring Boot 헬스체크
          log "🏥 Spring Boot 애플리케이션 헬스체크를 시작합니다..."
          ATTEMPT=0
          SPRING_SUCCESS=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              ATTEMPT=$((ATTEMPT + 1))

              # 컨테이너 실행 확인
              if ! docker ps | grep -q $CONTAINER_NAME; then
                  error "Spring Boot 컨테이너가 실행되지 않습니다!"
                  docker logs --tail 50 $CONTAINER_NAME 2>/dev/null || true
                  exit 1
              fi

              # Spring Boot 직접 헬스체크 (8080 포트)
              if docker exec $CONTAINER_NAME curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                  log "✅ Spring Boot가 정상 동작합니다."
                  SPRING_SUCCESS=true
                  break
              else
                  if [ $((ATTEMPT % 5)) -eq 0 ]; then
                      warn "Spring Boot 시작 대기 중... ($ATTEMPT/$MAX_ATTEMPTS)"
                  fi
                  sleep $HEALTH_CHECK_INTERVAL
              fi
          done

          if [ "$SPRING_SUCCESS" = false ]; then
              error "Spring Boot 헬스체크 실패"
              error "컨테이너 로그:"
              docker logs --tail 100 $CONTAINER_NAME
              exit 1
          fi

          # Caddy 프록시 확인 (필수)
          log "🔍 Caddy 리버스 프록시를 확인합니다..."
          sleep 10
          
          CADDY_SUCCESS=false
          for i in {1..30}; do
              # Caddy 자체 /health 엔드포인트로 체크 (JWT 불필요)
              if curl -sf http://localhost/health > /dev/null 2>&1; then
                  log "✅ Caddy 프록시가 정상 동작합니다."
                  CADDY_SUCCESS=true
                  break
              fi
          
              if [ $((i % 5)) -eq 0 ]; then
                  warn "Caddy 프록시 시작 대기 중... ($i/30)"
              fi
              sleep 2
          done

          if [ "$CADDY_SUCCESS" = false ]; then
              error "Caddy 프록시 시작 실패"
              error "Caddy 로그:"
              docker logs --tail 50 caddy 2>/dev/null || true
              error "Caddy 상태:"
              docker inspect caddy --format='{{.State.Status}}: {{.State.Error}}' 2>/dev/null || true
              exit 1
          fi

          # 최종 상태 출력
          log "📊 최종 서비스 상태:"
          docker compose ps
          
          echo ""
          log "🌐 서비스 접속 정보:"
          echo "  - HTTP (프록시): http://43.200.40.140"
          echo "  - Spring Boot (직접): http://43.200.40.140:8080"
          echo "  - Swagger UI: http://43.200.40.140/swagger-ui.html"
          echo "  - Health Check: http://43.200.40.140/actuator/health"
          
          log "🎉 배포가 성공적으로 완료되었습니다!"
          EOF
          chmod +x deploy.sh

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "image.tar.gz,compose.yaml,deploy.sh,Caddyfile"
          target: "/home/ubuntu/back-end"
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/back-end

            echo "🚀 EC2 배포 프로세스를 시작합니다..."

            echo "📦 Docker 이미지를 로드합니다..."
            docker load < image.tar.gz
            rm image.tar.gz
            echo "✅ Docker 이미지 로드 완료"

            echo "🔍 현재 Docker 이미지 목록:"
            docker images | grep -E "REPOSITORY|intelfit"

            echo "🎯 배포 스크립트를 실행합니다..."
            chmod +x deploy.sh
            ./deploy.sh

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "🔍 최종 배포 검증을 시작합니다..."
            cd /home/ubuntu/back-end

            # 충분한 대기 시간
            sleep 20

            # 변수 초기화
            SPRING_HEALTH=false
            CADDY_HEALTH=false
            
            # Spring Boot 헬스체크 (필수)
            echo "🏥 Spring Boot 헬스체크 중..."
            for i in {1..20}; do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ Spring Boot 서비스가 정상 동작합니다."
                SPRING_HEALTH=true
                break
              fi
              echo "  대기 중... ($i/20)"
              sleep 3
            done

            # Caddy 프록시 헬스체크 (필수)
            echo "🔍 Caddy 프록시 확인 중..."
            for i in {1..30}; do
              # Caddy 자체 /health 엔드포인트로 체크 (JWT 불필요)
              if curl -sf http://localhost/health > /dev/null 2>&1; then
                echo "✅ Caddy 프록시가 정상 동작합니다."
                CADDY_HEALTH=true
                break
              fi
            
              if [ $((i % 5)) -eq 0 ]; then
                echo "  Caddy 대기 중... ($i/30)"
              fi
              sleep 2
            done

            echo ""
            echo "📊 최종 서비스 상태:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo ""
            echo "🌐 서비스 접속 정보:"
            
            # 검증 결과
            if [ "$SPRING_HEALTH" = true ] && [ "$CADDY_HEALTH" = true ]; then
              echo "  ✅ HTTP (프록시): http://43.200.40.140"
              echo "  ✅ Spring Boot (직접): http://43.200.40.140:8080"
              echo "  ✅ Swagger UI: http://43.200.40.140/swagger-ui.html"
              echo "  ✅ Health Check: http://43.200.40.140/actuator/health"
              echo "  ✅ API Base: http://43.200.40.140/api"
              echo ""
              echo "🎉 IntelFit 백엔드가 성공적으로 배포되었습니다!"
              exit 0
            else
              echo ""
              echo "❌ 배포 검증 실패"
            
              if [ "$SPRING_HEALTH" = false ]; then
                echo ""
                echo "📋 Spring Boot 컨테이너 로그:"
                docker logs --tail 50 spring-app || echo "로그를 가져올 수 없습니다."
              fi
            
              if [ "$CADDY_HEALTH" = false ]; then
                echo ""
                echo "📋 Caddy 컨테이너 로그:"
                docker logs --tail 50 caddy || echo "로그를 가져올 수 없습니다."
                echo ""
                echo "🔍 Caddy 상태 상세 정보:"
                docker inspect caddy --format='{{.State.Status}}: {{.State.Error}}' || true
              fi
            
              echo ""
              echo "📊 현재 컨테이너 상태:"
              docker ps -a | grep -E "CONTAINER|spring-app|mysql|redis|caddy"
              exit 1
            fi
