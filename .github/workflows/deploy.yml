name: CI/CD Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  DOCKER_IMAGE: intelfit-backend
  EC2_HOST: 15.165.68.196
  EC2_USER: ubuntu

jobs:
  test:
    # test job은 그대로 유지
    runs-on: ubuntu-latest
    # ... (기존 내용 유지)

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "🔧 Building Docker image with no cache to ensure latest dependencies..."
          docker build --no-cache --pull -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
          echo "✅ Docker image built successfully"

      - name: Save Docker image
        run: |
          echo "📦 Saving Docker image..."
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > image.tar.gz
          ls -lh image.tar.gz

      - name: Create .env file with secrets
        run: |
          cat > .env << EOF
          # MySQL 설정
          MYSQL_DATABASE=intelfit
          MYSQL_ROOT_PASSWORD=Admin123!

          # Spring Boot 환경변수
          SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/intelfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME=root
          SPRING_DATASOURCE_PASSWORD=Admin123!
          SPRING_JPA_HIBERNATE_DDL_AUTO=update
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect

          # Redis
          SPRING_DATA_REDIS_HOST=redis
          SPRING_DATA_REDIS_PORT=6379

          # Server Port
          SERVER_PORT=8080

          # JWT 설정
          JWT_SECRET=intelfit-jwt-secret-key-for-production-use-minimum-32-characters-long-2024
          JWT_ACCESS_TOKEN_EXPIRATION=3600000
          JWT_REFRESH_TOKEN_EXPIRATION=604800000

          # 이메일 설정 (Naver)
          SPRING_MAIL_HOST=smtp.naver.com
          SPRING_MAIL_PORT=587
          SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}

          # 애플리케이션 설정
          APP_NAME=IntelFit
          EOF

      # Caddyfile 생성 추가
      - name: Create Caddyfile
        run: |
          cat > Caddyfile << 'EOF'
          intelfit.com, www.intelfit.com {
              reverse_proxy spring-app:8080
          }

          # IP 접근도 허용 (HTTP만)
          :80 {
              respond /health "OK" 200
              reverse_proxy spring-app:8080
          }
          EOF

      # compose.yaml 생성 (Caddy 포함)
      - name: Create compose.yaml with Caddy
        run: |
          cat > compose.yaml << 'EOF'
          services:
            mysql:
              image: mysql:8.0
              container_name: mysql
              restart: always
              environment:
                MYSQL_DATABASE: intelfit
                MYSQL_ROOT_PASSWORD: Admin123!
                MYSQL_CHARACTER_SET_SERVER: utf8mb4
                MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
                TZ: Asia/Seoul
              ports:
                - "3306:3306"
              volumes:
                - mysql_data:/var/lib/mysql
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pAdmin123!"]
                interval: 10s
                timeout: 5s
                retries: 10
                start_period: 30s
              networks:
                - app-network

            redis:
              image: redis:7.2-alpine
              container_name: redis
              restart: always
              ports:
                - "6379:6379"
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 10s
                timeout: 3s
                retries: 5
                start_period: 10s
              networks:
                - app-network

            caddy:
              image: caddy:2-alpine
              container_name: caddy
              restart: always
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./Caddyfile:/etc/caddy/Caddyfile
                - caddy_data:/data
                - caddy_config:/config
              depends_on:
                - app
              networks:
                - app-network

            app:
              build: .
              image: intelfit-backend:latest
              container_name: spring-app
              restart: always
              env_file:
                - .env
              depends_on:
                mysql:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              environment:
                SPRING_PROFILES_ACTIVE: docker
                JAVA_OPTS: "-Xms512m -Xmx1024m"
                TZ: Asia/Seoul
                SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/intelfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
                SPRING_DATASOURCE_USERNAME: root
                SPRING_DATASOURCE_PASSWORD: Admin123!
                SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
              ports:
                - "8080:8080"
              healthcheck:
                test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
                interval: 30s
                timeout: 10s
                retries: 10
                start_period: 90s
              networks:
                - app-network

          networks:
            app-network:
              driver: bridge

          volumes:
            mysql_data:
              driver: local
            caddy_data:
              driver: local
            caddy_config:
              driver: local
          EOF

      - name: Create deploy.sh
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash

          # ... (기존 deploy.sh 내용 그대로 유지)
          # 단, 접속 정보 부분만 수정

          # (기존 내용...)

                  log "🌐 애플리케이션 접속 정보:"
                  echo "   - HTTP (IP): http://15.165.68.196/"
                  echo "   - HTTPS: https://intelfit.com (도메인 설정 시)"
                  echo "   - HTTPS: https://www.intelfit.com (도메인 설정 시)"
                  echo "   - Swagger UI: http://15.165.68.196/swagger-ui.html"
                  echo "   - Health Check: http://15.165.68.196/actuator/health"
                  log "🎉 배포가 성공적으로 완료되었습니다!"

          # (나머지 내용...)
          EOF
          chmod +x deploy.sh

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "image.tar.gz,compose.yaml,.env,deploy.sh,Caddyfile"  # Caddyfile 추가
          target: "/home/ubuntu/back-end"
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/back-end
            
            echo "🚀 EC2 배포 프로세스를 시작합니다..."
            
            echo "📦 Docker 이미지를 로드합니다..."
            docker load < image.tar.gz
            rm image.tar.gz
            echo "✅ Docker 이미지 로드 완료"
            
            echo "🔍 현재 Docker 이미지 목록:"
            docker images | grep -E "REPOSITORY|intelfit"
            
            echo "🎯 배포 스크립트를 실행합니다..."
            chmod +x deploy.sh
            ./deploy.sh

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "🔍 최종 배포 검증을 시작합니다..."
            cd /home/ubuntu/back-end
            
            sleep 15
            
            if curl -sf http://localhost/actuator/health > /dev/null; then
              echo "✅ 최종 배포 검증 성공!"
              echo ""
              echo "📊 최종 서비스 상태:"
              docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              echo ""
              echo "🌐 서비스 접속 정보:"
              echo "  - HTTP (IP): http://15.165.68.196/"
              echo "  - HTTPS: https://intelfit.com (도메인 연결 시)"
              echo "  - Swagger UI: http://15.165.68.196/swagger-ui.html"
              echo ""
              echo "🎉 IntelFit 백엔드가 성공적으로 배포되었습니다!"
            else
              echo "❌ 최종 배포 검증 실패"
              echo "📋 컨테이너 로그 (마지막 50줄):"
              docker logs --tail 50 spring-app || echo "로그를 가져올 수 없습니다."
              echo ""
              echo "📊 현재 컨테이너 상태:"
              docker ps -a | grep -E "CONTAINER|spring-app|mysql|redis|caddy"
              exit 1
            fi