version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: spring-app
    restart: always
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    ports:
      - "80:8080"

volumes:
  mysql_data:
