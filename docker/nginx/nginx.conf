
server {
    listen 80;
    server_name localhost;

    # ✅ React 등 정적 파일 제공 (필요 시)
    root /usr/share/nginx/html;
    index index.html;

    # ✅ 백엔드(Spring Boot) 프록시 연결
    location /api/ {
        proxy_pass http://spring-app:8080;  # docker-compose의 서비스명 기준
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ✅ 기본 응답 (테스트용)
    location / {
        return 200 'Nginx is running and proxying to Spring!';
        add_header Content-Type text/plain;
    }
}
