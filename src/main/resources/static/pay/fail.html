<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결제 실패</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e, #0f3460);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      }

      .container {
        text-align: center;
        padding: 40px 20px;
        max-width: 500px;
        width: 100%;
      }

      .icon-circle {
        width: 150px;
        height: 150px;
        margin: 0 auto 32px;
        border-radius: 75px;
        background: linear-gradient(135deg, #ef4444, #dc2626);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        animation: bounce 1s ease-in-out;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      h1 {
        font-size: 32px;
        margin-bottom: 12px;
        font-weight: 800;
      }

      p {
        font-size: 16px;
        color: #9ca3af;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .info-card {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 30px;
        text-align: left;
      }

      .info-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .info-row:last-child {
        margin-bottom: 0;
      }

      .info-text {
        flex: 1;
        font-size: 14px;
        font-weight: 500;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
      }

      .primary-button {
        background: linear-gradient(135deg, #e3ff7c, #a8e063);
        color: #111827;
        padding: 18px 40px;
        border-radius: 16px;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 700;
        font-size: 17px;
        transition: transform 0.2s;
        box-shadow: 0 4px 12px rgba(227, 255, 124, 0.3);
        border: none;
        cursor: pointer;
      }

      .primary-button:hover {
        transform: translateY(-2px);
      }

      .secondary-button {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        padding: 16px 40px;
        border-radius: 16px;
        text-decoration: none;
        display: inline-block;
        font-weight: 600;
        font-size: 16px;
        transition: transform 0.2s;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .secondary-button:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.12);
      }

      .loading {
        margin-top: 20px;
        font-size: 14px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon-circle">
        <div style="font-size: 80px">❌</div>
      </div>

      <h1>결제 실패</h1>
      <p>
        결제 처리 중 오류가 발생했습니다.<br />
        다시 시도해 주세요.
      </p>

      <div class="info-card">
        <div class="info-row">
          <span style="font-size: 20px">⚠️</span>
          <span class="info-text">카드 정보를 다시 확인해 주세요</span>
        </div>
        <div class="info-row">
          <span style="font-size: 20px">💳</span>
          <span class="info-text">결제 한도가 충분한지 확인해 주세요</span>
        </div>
        <div class="info-row">
          <span style="font-size: 20px">❓</span>
          <span class="info-text">문제가 지속되면 고객센터로 문의하세요</span>
        </div>
      </div>

      <div class="button-group">
        <a href="#" class="primary-button" id="retryButton">
          <span style="font-size: 20px">🔄</span>
          <span>다시 시도</span>
        </a>
        <a href="#" class="secondary-button" id="homeButton">홈으로</a>
      </div>

      <p class="loading" id="autoRedirect">
        5초 후 자동으로 앱으로 이동합니다...
      </p>
    </div>

    <script>
      // URL에서 쿼리 파라미터 가져오기
      const urlParams = new URLSearchParams(window.location.search);
      const paymentId = urlParams.get("paymentId");
      const userId = urlParams.get("userId");

      // Deep Link URL
      const failScheme = "intelfit://pay/fail";
      const deepLinkUrl = `${failScheme}?paymentId=${paymentId}&userId=${userId}`;

      // 버튼 설정
      document.getElementById("retryButton").href = deepLinkUrl;
      document.getElementById("homeButton").href = deepLinkUrl;

      // 5초 후 자동으로 앱으로 이동
      let countdown = 5;
      const autoRedirectText = document.getElementById("autoRedirect");

      const timer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          autoRedirectText.textContent = `${countdown}초 후 자동으로 앱으로 이동합니다...`;
        } else {
          clearInterval(timer);
          window.location.href = deepLinkUrl;
        }
      }, 1000);
    </script>
  </body>
</html>
