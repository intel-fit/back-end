server:
  port: 8081

spring:
  application:
    name: intelfit

  datasource:
    url: jdbc:mysql://localhost:3306/intelfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Admin123!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs
  show-actuator: true

logging:
  level:
    root: INFO
    rto.intelfit: DEBUG

# application.yml에 추가할 JWT 설정
jwt:
  secret: mySecretKeyForJwtTokenGenerationAndValidation1234567890  # 최소 32자 이상
  access-token-expiration: 3600000   # 1시간 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)