server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

  # ⭐ 추가: Tomcat의 요청 타임아웃 (300초)
  tomcat:
    connection-timeout: 300000

spring:
  config:
    activate:
      on-profile: default
  application:
    name: intelfit

  # ⭐ 추가: Spring MVC async 요청 타임아웃 (300초)
  mvc:
    async:
      request-timeout: 300000

  datasource:
    url: jdbc:mysql://localhost:3306/intelfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Admin123!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update  # ✅ 다시 원복
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  mail:
    host: smtp.naver.com
    port: 587
    username: lkmm1108@naver.com
    password: YJTGKZ924715
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          timeout: 5000
          connectiontimeout: 5000
        debug: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs
  show-actuator: true

logging:
  level:
    root: INFO
    rto.intelfit: DEBUG
    rto.intelfit.security: DEBUG
    rto.intelfit.util.JwtUtil: DEBUG
    org.springframework.mail: DEBUG

jwt:
  secret: mySecretKeyForJwtTokenGenerationAndValidation1234567890
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

# AI 서버 설정
ai:
  server:
    url: ${AI_SERVER_URL:http://43.200.40.140:8000}
    api-key: ${AI_SERVER_API_KEY:dummy}
    timeout:
      connect: 5000

      # ⭐ 변경: AI read timeout 30초 → 300초
      read: 300000

app:
  name: IntelFit

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:dummy}
      folder: ${AWS_S3_INBODY_FOLDER:inbody-records}
      base-url: ${AWS_S3_BASE_URL:dummy}

gemini:
  api-key: ${GEMINI_API_KEY:dummy}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:dummy}
  javascript-key: ${KAKAO_JAVASCRIPT_KEY:dummy}
  redirect-uri: "${KAKAO_REDIRECT_URI:http://localhost:19002/auth/kakao/callback}"
  auth-url: https://kauth.kakao.com/oauth/authorize
  token-url: https://kauth.kakao.com/oauth/token
  user-info-url: https://kapi.kakao.com/v2/user/me

kakaopay:
  cid: ${KAKAOPAY_CID:TC0ONETIME}
  admin-key: ${KAKAOPAY_ADMIN_KEY:dummy}
  rest-api-key: ${KAKAOPAY_REST_API_KEY:dummy}
  ready-url: https://kapi.kakao.com/v1/payment/ready
  approve-url: https://kapi.kakao.com/v1/payment/approve
  redirect:
    approval: "${KAKAOPAY_APPROVAL_URL:https://intelfit.com/pay/success}"
    cancel: "${KAKAOPAY_CANCEL_URL:https://intelfit.com/pay/cancel}"
    fail: "${KAKAOPAY_FAIL_URL:https://intelfit.com/pay/fail}"
  plan:
    monthly:
      item-name: ${KAKAOPAY_PLAN_MONTHLY_ITEM_NAME:intelfit premium montly}
      amount: ${KAKAOPAY_PLAN_MONTHLY_AMOUNT:5900}
      tax-free-amount: ${KAKAOPAY_PLAN_MONTHLY_TAX_FREE:0}
    annual:
      item-name: ${KAKAOPAY_PLAN_ANNUAL_ITEM_NAME:intelfit premium annually}
      amount: ${KAKAOPAY_PLAN_ANNUAL_AMOUNT:59000}
      tax-free-amount: ${KAKAOPAY_PLAN_ANNUAL_TAX_FREE:0}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:dummy}
  price-id:
    monthly: ${STRIPE_PRICE_ID_MONTHLY:dummy}
    annual: ${STRIPE_PRICE_ID_ANNUAL:dummy}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:dummy}
  success-url: "${STRIPE_SUCCESS_URL:https://intelfit.com/pay/success}"
  cancel-url: "${STRIPE_CANCEL_URL:https://intelfit.com/pay/cancel}"
