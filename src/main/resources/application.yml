
server:
  port: 8081

spring:
  config:
    activate:
      on-profile: default   # ✅ 이 파일은 기본 프로필용
  application:
    name: intelfit


  datasource:
    url: jdbc:mysql://localhost:3306/intelfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Admin123!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # 이메일 설정
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          timeout: 5000
          connectiontimeout: 5000
        debug: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs
  show-actuator: true

logging:
  level:
    root: INFO
    rto.intelfit: DEBUG
    rto.intelfit.security: DEBUG
    rto.intelfit.util.JwtUtil: DEBUG
    org.springframework.mail: DEBUG

# JWT 설정
jwt:
  secret: mySecretKeyForJwtTokenGenerationAndValidation1234567890
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

# 앱 설정
app:
  name: IntelFit