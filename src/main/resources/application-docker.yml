server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  config:
    activate:
      on-profile: docker
  application:
    name: intelfit


  datasource:
    url: jdbc:mysql://mysql:3306/intelfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
    username: root
    password: Admin123!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        ddl-auto: update
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true

    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
      connect-timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # 이메일 설정
  mail:
    host: ${SPRING_MAIL_HOST:smtp.naver.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:dummy}
    password: ${SPRING_MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          timeout: 5000
          connectiontimeout: 5000
        debug: false

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs
  show-actuator: true

logging:
  level:
    root: INFO
    rto.intelfit: INFO
    org.springframework.web: INFO
    org.hibernate: DEBUG
    org.springframework.mail: TRACE

jwt:
  secret: ${JWT_SECRET:intelfit-jwt-secret-key-for-production-use-minimum-32-characters-long-2024}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# AI 서버 설정
ai:
  server:
    url: ${AI_SERVER_URL:http://43.200.40.140:8000}
    api-key: ${AI_SERVER_API_KEY:dummy}
    timeout:
      connect: 5000
      read: 30000

# 앱 설정
app:
  name: IntelFit

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:dummy}
      folder: ${AWS_S3_INBODY_FOLDER:inbody-records}
      base-url: ${AWS_S3_BASE_URL:dummy}

gemini:
  api-key: ${GEMINI_API_KEY:dummy}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}


kakaopay:
  cid: ${KAKAOPAY_CID:TC0ONETIME}
  admin-key: ${KAKAOPAY_ADMIN_KEY:dummy}
  rest-api-key: ${KAKAOPAY_REST_API_KEY:dummy}
  ready-url: https://kapi.kakao.com/v1/payment/ready
  approve-url: https://kapi.kakao.com/v1/payment/approve
  redirect:
    approval: "${KAKAOPAY_APPROVAL_URL:https://intelfit.com/pay/success}"
    cancel: "${KAKAOPAY_CANCEL_URL:https://intelfit.com/pay/cancel}"
    fail: "${KAKAOPAY_FAIL_URL:https://intelfit.com/pay/fail}"
  plan:
    monthly:
      item-name: ${KAKAOPAY_PLAN_MONTHLY_ITEM_NAME:intelfit premium montly}
      amount: ${KAKAOPAY_PLAN_MONTHLY_AMOUNT:5900}
      tax-free-amount: ${KAKAOPAY_PLAN_MONTHLY_TAX_FREE:0}
    annual:
      item-name: ${KAKAOPAY_PLAN_ANNUAL_ITEM_NAME:intelfit premium annually}
      amount: ${KAKAOPAY_PLAN_ANNUAL_AMOUNT:59000}
      tax-free-amount: ${KAKAOPAY_PLAN_ANNUAL_TAX_FREE:0}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:dummy}
  price-id:
    monthly: ${STRIPE_PRICE_ID_MONTHLY:dummy}
    annual: ${STRIPE_PRICE_ID_ANNUAL:dummy}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:dummy}
  success-url: "${STRIPE_SUCCESS_URL:https://intelfit.com/pay/success}"
  cancel-url: "${STRIPE_CANCEL_URL:https://intelfit.com/pay/cancel}"