server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  config:
    activate:
      on-profile: docker
  application:
    name: intelfit

  datasource:
    url: jdbc:mysql://mysql:3306/intelfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
    username: root
    password: Admin123!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        ddl-auto: update
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
      connect-timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # 이메일 설정
  mail:
    host: ${SPRING_MAIL_HOST:smtp.naver.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          timeout: 5000
          connectiontimeout: 5000
        debug: false

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs
  show-actuator: true

logging:
  level:
    root: INFO
    rto.intelfit: INFO
    org.springframework.web: INFO
    org.hibernate: DEBUG
    org.springframework.mail: TRACE

jwt:
  secret: ${JWT_SECRET:intelfit-jwt-secret-key-for-production-use-minimum-32-characters-long-2024}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# AI 서버 설정
ai:
  server:
    url: ${AI_SERVER_URL:http://43.200.40.140:8000}
    api-key: ${AI_SERVER_API_KEY:}
    timeout:
      connect: 5000
      read: 30000

# 앱 설정
app:
  name: IntelFit

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      folder: ${AWS_S3_INBODY_FOLDER:inbody-records}
      base-url: ${AWS_S3_BASE_URL:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:7fc72724581279e69f3fd90de192b691}
  javascript-key: ${KAKAO_JAVASCRIPT_KEY:8f93a1757095b48d18fe50b632637f5a}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:19002/auth/kakao/callback}
  auth-url: https://kauth.kakao.com/oauth/authorize
  token-url: https://kauth.kakao.com/oauth/token
  user-info-url: https://kapi.kakao.com/v2/user/me